name: Bug report
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security vulnerabilities should be reported privately. See SECURITY.md.**
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...
        2. Run ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. v1.2.0 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP, Laravel, Node and OS versions, where relevant.
      placeholder: |
        PHP: 8.3
        Laravel: 12.x
        Node: 22.x
        OS: macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error output. It will be formatted as code automatically.
      render: shell
